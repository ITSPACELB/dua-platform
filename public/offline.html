<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>يُجيب - غير متصل</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #065f46 0%, #047857 50%, #059669 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: normal;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 30px;
      opacity: 0.85;
    }
    .verse {
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 30px;
      font-size: 1.3rem;
      line-height: 2;
    }
    button {
      background: white;
      color: #047857;
      border: none;
      padding: 15px 40px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>يُجيب</h1>
    <h2>أنت غير متصل بالإنترنت</h2>
    
    <div class="verse">
      ﴿ وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ ﴾
    </div>
    
    <p>
      لا تقلق! يمكنك الدعاء في أي وقت وأي مكان.
      <br>
      عند عودة الاتصال، ستعود المنصة للعمل تلقائياً.
    </p>
    
    <button onclick="location.reload()">
      🔄 إعادة المحاولة
    </button>
    
    <div class="footer">
      يُجيب - منصة الدعاء الجماعي
      <br>
      إنتاج الغافقي
    </div>
  </div>
</body>
</html>
